services:

  wacdo_mariadb:
    image: mariadb:10.11
    container_name: wacdo-quentin-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE:      ${DB_NAME}
      MARIADB_USER:          ${DB_USER}
      MARIADB_PASSWORD:      ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - wacdo_bak_quentin
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  wacdo_php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: wacdo-quentin-php:latest
    container_name: wacdo-quentin-php
    restart: unless-stopped
    environment:
      DB_HOST:     wacdo_mariadb
      DB_PORT:     ${DB_PORT}
      DB_NAME:     ${DB_NAME}
      DB_USER:     ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_CHARSET:  ${DB_CHARSET}
      FRONT_URL:   ${FRONT_URL}
    volumes:
      - .:/var/www/html
    depends_on:
      wacdo_mariadb:
        condition: service_healthy
    networks:
      - wacdo_bak_quentin
      - admin_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=admin_proxy"
      - "traefik.http.routers.wacdo-quentin-back.rule=Host(`${BACK_URL}`)"
      - "traefik.http.routers.wacdo-quentin-back.entrypoints=web"
      - "traefik.http.routers.wacdo-quentin-back.middlewares=redirect-https"
      - "traefik.http.services.wacdo-quentin-back.loadbalancer.server.port=80"
      - "traefik.http.routers.wacdo-quentin-back-secure.rule=Host(`${BACK_URL}`)"
      - "traefik.http.routers.wacdo-quentin-back-secure.entrypoints=websecure"
      - "traefik.http.routers.wacdo-quentin-back-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.wacdo-quentin-back-secure.service=wacdo-quentin-back"

  wacdo_front:
    image: httpd:2.4-alpine
    container_name: wacdo-quentin-front
    restart: unless-stopped
    volumes:
      - ./index.html:/usr/local/apache2/htdocs/index.html:ro
      - ./assets/css/borne.css:/usr/local/apache2/htdocs/assets/css/borne.css:ro
      - ./assets/js/borne.js:/usr/local/apache2/htdocs/assets/js/borne.js:ro
      - ./wacdo/categories.json:/usr/local/apache2/htdocs/wacdo/categories.json:ro
      - ./wacdo/produits.json:/usr/local/apache2/htdocs/wacdo/produits.json:ro
      - ./wacdo/images:/usr/local/apache2/htdocs/wacdo/images:ro
      - ./wacdo/categories:/usr/local/apache2/htdocs/wacdo/categories:ro
      - ./wacdo/burgers:/usr/local/apache2/htdocs/wacdo/burgers:ro
      - ./wacdo/boissons:/usr/local/apache2/htdocs/wacdo/boissons:ro
      - ./wacdo/desserts:/usr/local/apache2/htdocs/wacdo/desserts:ro
      - ./wacdo/encas:/usr/local/apache2/htdocs/wacdo/encas:ro
      - ./wacdo/frites:/usr/local/apache2/htdocs/wacdo/frites:ro
      - ./wacdo/salades:/usr/local/apache2/htdocs/wacdo/salades:ro
      - ./wacdo/sauces:/usr/local/apache2/htdocs/wacdo/sauces:ro
      - ./wacdo/wraps:/usr/local/apache2/htdocs/wacdo/wraps:ro
    networks:
      - admin_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=admin_proxy"
      - "traefik.http.routers.wacdo-quentin-front.rule=Host(`${FRONT_URL}`)"
      - "traefik.http.routers.wacdo-quentin-front.entrypoints=web"
      - "traefik.http.routers.wacdo-quentin-front.middlewares=redirect-https"
      - "traefik.http.services.wacdo-quentin-front.loadbalancer.server.port=80"
      - "traefik.http.routers.wacdo-quentin-front-secure.rule=Host(`${FRONT_URL}`)"
      - "traefik.http.routers.wacdo-quentin-front-secure.entrypoints=websecure"
      - "traefik.http.routers.wacdo-quentin-front-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.wacdo-quentin-front-secure.service=wacdo-quentin-front"

networks:
  wacdo_bak_quentin:
    external: true
    name: wacdo_bak_quentin
  admin_proxy:
    external: true

volumes:
  mariadb_data:
    driver: local
